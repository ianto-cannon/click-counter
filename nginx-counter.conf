# /etc/nginx/sites-available/counter
# Files in sites-available are included inside nginx's http context,
# so the zone below can sit at the top level of this file.

# Per-visitor rate limit for the counter endpoint (5 requests/second on average)
limit_req_zone $binary_remote_addr zone=click:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name counter.maricakes.de;

    root /var/www/counter;
    index index.html;

    # Behind a Cloudflare Tunnel every request arrives from cloudflared on this
    # machine. Trust CF-Connecting-IP only on those local connections, so the
    # rate limit and the logs see the real visitor address.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    # Security headers
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # "gzip on;" is already set in /etc/nginx/nginx.conf; this adds the types
    gzip_types text/css text/javascript application/javascript image/svg+xml;

    # Static files
    location / {
        try_files $uri $uri/ =404;
    }

    # The counter endpoint: the only PHP file that may run
    location = /click.php {
        limit_req zone=click burst=10 nodelay;
        limit_req_status 429;

        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    # Any other .php file is never executed or served as source
    location ~ \.php$ {
        return 404;
    }

    # Hide dotfiles such as .git
    location ~ /\. {
        return 404;
    }
}
