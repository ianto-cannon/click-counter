limit_req_zone $binary_remote_addr zone=click:10m rate=5r/s;

server {
    listen 127.0.0.1:80;
    listen [::1]:80;

    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    server_name counter.maricakes.de;

    root /var/www/counter;
    index index.html;
    
    gzip_types text/css text/javascript application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /click.php {
        limit_req zone=click burst=10 nodelay;
        limit_req_status 429;

        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location ~ \.php$ {
        return 404;
    }

}
